name: Release

on:
  push:
    branches:
      - main
      - master

jobs:
  release:
    if: "!startsWith(github.event.head_commit.message, '\U0001F528 chore: release')"
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Cut release
        run: node .github/scripts/release.mjs

      - name: Push release
        run: git push && git push --tags
